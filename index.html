<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0D12">
  <meta name="description" content="追竞：关注你的热爱，不错过下一场。电竞赛程与提醒小程序交互 Demo。">
  <title>追竞 · 每一场热爱，都准时在场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0D12'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='%23FF4655'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <!-- 外层：桌面浏览器里居中手机容器，手机里全屏 -->
  <div class="device-shell">
    <div class="app">
      <!-- 顶部：状态栏 + 导航栏（胶囊按钮占位） -->
      <header class="app-header">
        <div class="status-bar"></div>
        <div class="nav-bar">
          <span class="nav-title">追竞</span>
          <span class="capsule" aria-hidden="true"></span>
        </div>
      </header>
      <!-- 主内容区 -->
      <main id="main" class="app-main" tabindex="-1"></main>
      <!-- 底部 tab bar -->
      <nav id="tab-bar" class="tab-bar" aria-label="主导航"></nav>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <!-- 弹窗（小程序风格 modal） -->
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script type="module" src="app.js?v=8"></script>
</body>
</html>
